name: Bug report
description: Report one reproducible DreamBook Goose ChatGPT Web failure with privacy-safe evidence.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This repository is the Debian/DreamBook Goose ChatGPT Web appliance. Never upload cookies, browser/profile state, API keys, tunnel/runtime keys, raw prompts, tool output, private repository content, or unredacted logs.

  - type: input
    id: source-checkpoint
    attributes:
      label: Source checkpoint
      description: Commit or installed bundle identifier that reproduced the failure.
    validations:
      required: true

  - type: input
    id: goose-version
    attributes:
      label: Goose version
      placeholder: goose 1.x.y
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed result, expected result, and the smallest safe reproduction.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Privacy-safe evidence
      description: Include only redacted health/status/test evidence needed to diagnose the failure.
    validations:
      required: false
